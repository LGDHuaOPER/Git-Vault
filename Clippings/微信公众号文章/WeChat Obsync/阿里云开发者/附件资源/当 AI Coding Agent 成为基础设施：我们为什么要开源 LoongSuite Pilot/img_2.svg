  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
   <defs>
    <filter x="-3%" y="-3%" width="106%" height="106%">
     <fedropshadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08">
     </fedropshadow>
    </filter>
    <linearGradient x1="0%" y1="0%" x2="100%" y2="100%">
     <stop offset="0%" style="stop-color:#667eea;stop-opacity:1">
     </stop>
     <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1">
     </stop>
    </linearGradient>
   </defs>
   <rect width="900" height="400" fill="#f8fafc" rx="12">
   </rect>
   <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">
    
    
    
    AI 编程 Agent 的可观测性：我们观察到的三层困难
   </text>
   <rect x="150" y="55" width="600" height="40" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#cs)">
   </rect>
   <text x="450" y="80" text-anchor="middle" font-size="12" fill="#64748b">
    
    
    
    Cursor · Claude Code · Codex · 通义灵码 · Qoder · ... 每天被数百万开发者使用
   </text>
   <rect x="40" y="115" width="260" height="195" rx="12" fill="#fff" stroke="#fca5a5" stroke-width="1.5" filter="url(#cs)">
   </rect>
   <rect x="40" y="115" width="260" height="38" rx="12" fill="#fef2f2">
   </rect>
   <rect x="40" y="141" width="260" height="12" fill="#fef2f2">
   </rect>
   <text x="170" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">
    
    
    
    Agent 行为天然难观测
   </text>
   <text x="60" y="175" font-size="11" fill="#475569">
    
    
    
    一次任务可能包含 10+ 轮 ReAct
   </text>
   <text x="60" y="195" font-size="11" fill="#475569">
    
    
    
    推理循环，每轮涉及：
   </text>
   <text x="60" y="220" font-size="11" fill="#64748b">
    
    
    
      • 模型调用（输入/输出/Token）
   </text>
   <text x="60" y="240" font-size="11" fill="#64748b">
    
    
    
      • 工具选择与执行
   </text>
   <text x="60" y="260" font-size="11" fill="#64748b">
    
    
    
      • 结果反思与下一步决策
   </text>
   <text x="60" y="288" font-size="10" fill="#94a3b8">
    
    
    
    传统 Metrics + Log + Trace 只能看到
   </text>
   <text x="60" y="303" font-size="10" fill="#94a3b8">
    
    
    
    一堆独立 HTTP 请求，无法还原决策流程
   </text>
   <rect x="320" y="115" width="260" height="195" rx="12" fill="#fff" stroke="#fdba74" stroke-width="1.5" filter="url(#cs)">
   </rect>
   <rect x="320" y="115" width="260" height="38" rx="12" fill="#fffbeb">
   </rect>
   <rect x="320" y="141" width="260" height="12" fill="#fffbeb">
   </rect>
   <text x="450" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">
    
    
    
    多 Agent 数据天然割裂
   </text>
   <text x="340" y="175" font-size="11" fill="#475569">
    
    
    
    每个 Agent 的数据：
   </text>
   <text x="340" y="200" font-size="11" fill="#64748b">
    
    
    
      • 格式不同（JSON / SQLite / 文本）
   </text>
   <text x="340" y="220" font-size="11" fill="#64748b">
    
    
    
      • 存储位置不同
   </text>
   <text x="340" y="240" font-size="11" fill="#64748b">
    
    
    
      • 记录粒度不同
   </text>
   <text x="340" y="260" font-size="11" fill="#64748b">
    
    
    
      • 字段语义不一致
   </text>
   <text x="340" y="288" font-size="10" fill="#94a3b8">
    
    
    
    想回答"哪个 Agent 更适合我们"
   </text>
   <text x="340" y="303" font-size="10" fill="#94a3b8">
    
    
    
    需要手动对比异构数据，无法规模化
   </text>
   <rect x="600" y="115" width="260" height="195" rx="12" fill="#fff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#cs)">
   </rect>
   <rect x="600" y="115" width="260" height="38" rx="12" fill="#eef2ff">
   </rect>
   <rect x="600" y="141" width="260" height="12" fill="#eef2ff">
   </rect>
   <text x="730" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">
    
    
    
    端侧是可观测的盲区
   </text>
   <text x="620" y="175" font-size="11" fill="#475569">
    
    
    
    现有方案的覆盖范围：
   </text>
   <text x="620" y="200" font-size="11" fill="#64748b">
    
    
    
      • 主机/容器 → LoongCollector ✓
   </text>
   <text x="620" y="220" font-size="11" fill="#64748b">
    
    
    
      • 服务端框架 → 语言探针 ✓
   </text>
   <text x="620" y="240" font-size="11" fill="#ef4444">
    
    
    
      • 开发者桌面 → 无覆盖 ✗
   </text>
   <text x="620" y="268" font-size="10" fill="#94a3b8">
    
    
    
    数据散落在 IDE 文件、SQLite、
   </text>
   <text x="620" y="283" font-size="10" fill="#94a3b8">
    
    
    
    Session 日志等本地各角落
   </text>
   <text x="620" y="298" font-size="10" fill="#94a3b8">
    
    
    
    传统探针完全触及不到
   </text>
   <rect x="150" y="335" width="600" height="50" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1">
   </rect>
   <text x="450" y="358" text-anchor="middle" font-size="13" fill="#475569" font-weight="500">
    
    
    
    核心问题：如何在不改造 Agent 的前提下，从端侧获取完整、统一、可靠的行为数据？
   </text>
   <text x="450" y="376" text-anchor="middle" font-size="11" fill="#94a3b8">
    
    
    
    这是我们接下来要回答的问题 →
   </text>
  </svg>
